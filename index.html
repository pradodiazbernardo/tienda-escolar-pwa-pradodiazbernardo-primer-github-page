<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda Escolar — PWA de ventas</title>
  <!-- La descripción es el texto que Google muestra bajo el título en los
       resultados de búsqueda (Lighthouse la revisa en la categoría SEO) -->
  <meta name="description" content="Tienda Escolar de la UTH: catálogo de productos, carrito de compras y ubicación de la sucursal, disponible incluso sin conexión.">

  <!-- Estas 3 líneas son las que convierten este sitio en una PWA instalable -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e6b5c">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/estilos.css">

  <!-- Leaflet: librería de mapas gratuita (sin API key) que usamos solo para
       dibujar la ruta hasta la sucursal (ver js/geolocalizacion.js) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>

  <!-- ============ APP SHELL ============
       El "app shell" es el esqueleto que SIEMPRE se ve igual (header, nav,
       contenedores vacíos). El Service Worker lo cachea completo para que
       cargue instantáneo incluso sin internet; solo los DATOS de adentro
       cambian (los llena JavaScript, ver csr.js). -->

  <header class="appbar">
    <h1>🛍️ Tienda Escolar</h1>
    <!-- este <span> lo actualiza app.js para mostrar conectado/sin conexión -->
    <span id="estado-conexion" class="pill">conectado</span>
  </header>

  <main>
    <!-- ---- Sección 1: Catálogo (CSR) ---- -->
    <section>
      <h2>Catálogo</h2>
      <!-- Este div no trae productos reales: si ves el código fuente (Ctrl+U)
           solo verás tarjetas "esqueleto" vacías. JavaScript (csr.js) pone los
           productos DESPUÉS de que la página ya cargó: por eso es "Renderizado en
           el Cliente" (CSR).
           Los esqueletos miden lo mismo que una tarjeta real (una por cada producto
           de catalogo.json) para que el Carrito no "brinque" hacia abajo cuando
           llegan los datos. Ese brinco es lo que Lighthouse mide como CLS. -->
      <div id="catalogo" class="grid" aria-busy="true" aria-label="Cargando catálogo">
        <div class="producto producto--cargando" aria-hidden="true"><div class="producto__foto"></div><strong>&nbsp;</strong><span class="precio">&nbsp;</span><p>&nbsp;</p><button type="button" disabled>Agregar al carrito</button></div>
        <div class="producto producto--cargando" aria-hidden="true"><div class="producto__foto"></div><strong>&nbsp;</strong><span class="precio">&nbsp;</span><p>&nbsp;</p><button type="button" disabled>Agregar al carrito</button></div>
        <div class="producto producto--cargando" aria-hidden="true"><div class="producto__foto"></div><strong>&nbsp;</strong><span class="precio">&nbsp;</span><p>&nbsp;</p><button type="button" disabled>Agregar al carrito</button></div>
        <div class="producto producto--cargando" aria-hidden="true"><div class="producto__foto"></div><strong>&nbsp;</strong><span class="precio">&nbsp;</span><p>&nbsp;</p><button type="button" disabled>Agregar al carrito</button></div>
      </div>
    </section>

    <!-- ---- Sección 2: Carrito ---- -->
    <section>
      <h2>Carrito</h2>
      <ul id="carrito-lista"></ul>
      <p>Total: $<span id="carrito-total">0</span></p>
      <button id="btn-sincronizar" type="button">Sincronizar carrito</button>
      <p id="carrito-mensaje" class="mensaje"></p>
    </section>

    <!-- ---- Sección 3: Notificaciones ---- -->
    <section>
      <h2>Notificaciones de ofertas</h2>
      <button id="btn-notificar" type="button">Activar notificaciones</button>
      <p id="notificaciones-mensaje" class="mensaje"></p>
    </section>

    <!-- ---- Sección 4: Ubicación (característica del dispositivo) ---- -->
    <section>
      <h2>Distancia a la sucursal</h2>
      <p class="sucursal-info">Sucursal única: <strong>Universidad Tecnológica de Hermosillo (UTH)</strong>, Hermosillo, Sonora.</p>
      <button id="btn-ubicacion" type="button">Usar mi ubicación</button>
      <p id="ubicacion-mensaje" class="mensaje"></p>
      <!-- Empieza oculto: geolocalizacion.js le quita "hidden" y lo llena de mapa
           en cuanto tiene tu ubicación y la ruta hasta la sucursal -->
      <div id="mapa-ruta" class="mapa" hidden></div>
    </section>
  </main>

  <footer>
    <p>Unidad 2 · PWA de ventas de ejemplo</p>
  </footer>

  <!-- Cargamos los scripts al final del <body>: así el HTML ya existe
       cuando el JavaScript intenta buscar los elementos con document.getElementById -->
  <script src="js/carrito.js"></script>
  <script src="js/csr.js"></script>
  <script src="js/notificaciones.js"></script>
  <!-- Leaflet debe cargar ANTES de geolocalizacion.js: ese script usa el
       objeto global "L" que esta librería crea -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/geolocalizacion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
